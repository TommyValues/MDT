<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambulance MDT UK</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#03101c;--panel:#071b2d;--panel2:#09243a;--line:#173b59;--blue:#0878e8;--text:#e8f2fb;--muted:#8fa9bf;--red:#ef3340;--amber:#ffb51b;--green:#20c978;--purple:#9b6cff;--cyan:#36b8ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{height:100vh;display:grid;grid-template-rows:68px 48px 1fr 76px;overflow:hidden}.top{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:#041523}.brand{display:flex;align-items:center;gap:12px;min-width:330px}.logo{background:#1477dc;color:white;font-weight:900;font-style:italic;font-size:22px;padding:6px 10px;border-radius:3px}.title{font-size:20px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:2px}.topinfo{margin-left:auto;display:flex;align-items:center;height:100%;gap:25px}.pill{display:flex;align-items:center;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:var(--green)}.nav{display:flex;background:#061a2b;border-bottom:1px solid var(--line)}.nav button{background:transparent;padding:0 26px;border-right:1px solid #102d44;color:#abc0d3}.nav button.active{background:#0b68c7;color:white;font-weight:700}.badge{background:var(--red);border-radius:12px;padding:2px 7px;font-size:10px;margin-left:5px}.body{display:grid;grid-template-columns:390px 1fr 390px;gap:12px;padding:12px;min-height:0}.panel{background:linear-gradient(180deg,#081d30,#061725);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:0}.panelhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panelhead h2{font-size:18px;margin:0}.filters{display:flex;gap:5px;padding:9px;border-bottom:1px solid var(--line)}.filter{background:#0b2942;padding:7px 12px;border-radius:4px;color:#b9d0e2}.filter.active{background:var(--blue);color:white}.incidents{overflow:auto;height:calc(100% - 101px)}.incident{padding:13px 12px;border-bottom:1px solid #12334e;border-left:4px solid transparent}.incident:hover,.incident.sel{background:#0a2941}.incident.sel{border-left-color:var(--blue)}.cat{display:inline-block;min-width:39px;text-align:center;border-radius:5px;padding:5px 6px;font-weight:900;color:#06111b}.c1{background:#ff4b55}.c2{background:#ffbd32}.c3{background:#28d47d}.c4{background:#48a6ff}.itop{display:flex;align-items:center;gap:8px}.itop strong{flex:1}.itime{color:var(--muted);font-size:12px}.addr{margin:7px 0;color:#d2e2ee}.meta{font-size:11px;color:var(--muted)}#map{width:100%;height:100%;min-height:0}.mapwrap{position:relative;min-width:0;overflow:hidden;border-radius:6px;border:1px solid var(--line)}.maptools{position:absolute;z-index:1000;top:12px;left:12px;display:flex;gap:7px}.maptools button{background:#071c2f;border:1px solid #2a5575;padding:9px 11px;border-radius:5px;box-shadow:0 2px 8px #0008}.maptools button.active{background:var(--blue)}.search{position:absolute;z-index:1000;top:12px;right:12px;display:flex;background:#071c2f;border:1px solid #2a5575;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px #0008}.search input{width:250px;background:transparent;border:0;padding:10px;color:white;outline:0}.search button{background:var(--blue);padding:0 14px}.routebox{position:absolute;z-index:1000;bottom:12px;left:12px;right:12px;background:#061a2aee;border:1px solid #2a5575;border-radius:6px;padding:10px;display:none;box-shadow:0 3px 12px #0009}.routebox.show{display:block}.routemain{display:flex;align-items:center;gap:12px}.routebig{font-size:21px;font-weight:800}.routehint{color:var(--muted);font-size:12px}.turns{display:flex;gap:8px;overflow:auto;margin-top:9px}.turn{background:#0a2941;border:1px solid #1b4969;border-radius:4px;padding:7px 9px;white-space:nowrap}.rightbody{height:calc(100% - 53px);overflow:auto}.priority{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.priority .cat{font-size:16px}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:transparent;padding:11px;color:var(--muted)}.tabs button.active{color:white;background:#0b2941}.details{padding:14px}.row{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-bottom:1px solid #102b40}.row span:first-child{color:var(--muted)}.task{margin:14px}.task button{display:flex;justify-content:space-between;width:100%;background:#0a2a43;padding:12px;border:1px solid #1a4b6c;margin:6px 0;border-radius:4px}.task button:hover{background:#0d3a5e}.notes{width:100%;min-height:90px;background:#061522;border:1px solid #1b405c;color:white;border-radius:4px;padding:9px}.bottom{display:grid;grid-template-columns:280px repeat(5,1fr) 280px;gap:8px;padding:9px 12px;background:#041522;border-top:1px solid var(--line)}.statusbox,.bigbtn{border:1px solid #214765;border-radius:5px;background:#081e31}.statusbox{padding:10px}.bigbtn{font-weight:800;font-size:15px}.bigbtn:hover{filter:brightness(1.2)}.attend{background:#075e38}.enroute{background:#07508e}.onscene{background:#76520a}.transport{background:#3e2675}.clear{background:#26384a}.modal{position:fixed;inset:0;background:#0009;z-index:3000;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#071b2d;border:1px solid #2a5575;border-radius:8px;box-shadow:0 10px 40px #000}.dialog h2{margin:0;padding:16px;border-bottom:1px solid var(--line)}.form{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{background:#041522;color:white;border:1px solid #234862;border-radius:4px;padding:9px}.dialogfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.btn{padding:9px 14px;border-radius:4px;background:#0c304b}.btn.primary{background:var(--blue)}.btn.danger{background:#8e1f29}.toast{position:fixed;right:18px;bottom:95px;background:#071b2d;border:1px solid #2b5978;padding:12px 15px;border-radius:5px;z-index:4000;display:none}.toast.show{display:block}.leaflet-control-attribution{background:#061522dd!important;color:#b7c8d6!important}.leaflet-control-attribution a{color:#78bfff!important}.leaflet-control-zoom a{background:#071b2d!important;color:white!important;border-color:#214765!important}.unit-icon{background:#0b7be5;color:#fff;border:2px solid #fff;border-radius:7px;padding:3px 5px;font-weight:900;box-shadow:0 2px 8px #0008}.incident-icon{border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff;box-shadow:0 2px 8px #0009}.mini{font-size:11px;color:var(--muted)}@media(max-width:1150px){.body{grid-template-columns:320px 1fr}.body>.panel:last-child{display:none}.bottom{grid-template-columns:220px repeat(5,1fr)}}@media(max-width:800px){.app{grid-template-rows:60px 44px 1fr 130px}.topinfo{display:none}.brand{min-width:0}.title{font-size:16px}.nav button{padding:0 12px}.body{grid-template-columns:1fr}.body>.panel:first-child{display:none}.bottom{grid-template-columns:1fr 1fr 1fr;grid-template-rows:55px 55px}.statusbox{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">NHS*</div><div><div class="title">Ambulance MDT UK</div><div class="sub">Terrafix-inspired CAD / MDT • Training & Simulation</div></div></div><div class="topinfo"><div><b id="clock">15:53</b><div class="sub" id="date">07/10/2026</div></div><div class="pill"><span class="dot"></span>Online</div><div>⚕ Control<br><span class="sub">Blackpool</span></div><div>👤 <b>Paramedic</b><br><span class="sub">Unit 123</span></div><button class="btn" onclick="openSettings()">☰</button></div></header>
<nav class="nav"><button class="active" data-page="incidents">Incidents <span class="badge" id="incidentBadge">6</span></button><button data-page="map">Map</button><button data-page="resources">Resources</button><button data-page="messages">Messages <span class="badge" id="msgBadge">2</span></button><button data-page="patient">Patient Info</button><button data-page="reports">Reports</button><button data-page="settings">Settings</button></nav>
<main class="body">
<section class="panel"><div class="panelhead"><h2>Incidents (<span id="count">6</span>)</h2><button class="btn primary" onclick="openIncident()">＋ New</button></div><div class="filters"><button class="filter active" onclick="filterInc('all',this)">All</button><button class="filter" onclick="filterInc('C1',this)">Cat 1</button><button class="filter" onclick="filterInc('C2',this)">Cat 2</button><button class="filter" onclick="filterInc('C3',this)">Cat 3</button><button class="filter" onclick="filterInc('C4',this)">Cat 4</button></div><div class="incidents" id="incidentList"></div></section>
<section class="mapwrap"><div id="map"></div><div class="maptools"><button id="normalBtn" class="active" onclick="setLayer('normal')">Map</button><button id="darkBtn" onclick="setLayer('dark')">Dark</button><button onclick="locateUnit()">◎ Unit</button><button onclick="map.fitBounds(blackpoolBounds,{padding:[30,30]})">⌂ Blackpool</button></div><div class="search"><input id="searchInput" placeholder="Search address / postcode" onkeydown="if(event.key==='Enter')searchPlace()"><button onclick="searchPlace()">Search</button></div><div class="routebox" id="routeBox"><div class="routemain"><div><div class="routebig" id="routeTime">-- min</div><div class="routehint" id="routeDistance">Route not calculated</div></div><div style="margin-left:auto"><button class="btn" onclick="clearRoute()">Clear</button></div></div><div class="turns" id="turns"></div></div></section>
<section class="panel"><div class="priority" id="priority"></div><div class="tabs"><button class="active" onclick="tab('details',this)">Details</button><button onclick="tab('history',this)">History</button><button onclick="tab('notes',this)">Notes</button></div><div class="rightbody" id="rightBody"></div></section>
</main>
<footer class="bottom"><div class="statusbox"><div><span class="dot"></span> <b id="unitStatus">Available</b></div><div class="mini">Unit 123 • Paramedic / ECA</div><select id="unitMode" style="margin-top:6px;width:100%;background:#041522;color:white;border:1px solid #214765;padding:5px;border-radius:4px" onchange="setUnitStatus(this.value)"><option>Available</option><option>Meal Break</option><option>Standby</option><option>Unavailable</option></select></div><button class="bigbtn attend" onclick="setStatus('Attending')">🚑 Attend</button><button class="bigbtn enroute" onclick="setStatus('En Route')">➜ En Route</button><button class="bigbtn onscene" onclick="setStatus('On Scene')">● On Scene</button><button class="bigbtn transport" onclick="setStatus('Transport')">✚ Transport</button><button class="bigbtn clear" onclick="setStatus('Clear')">✓ Clear</button><button class="bigbtn" onclick="openMessages()">💬 Messages <span class="badge">2</span></button></footer>
</div>
<div class="modal" id="incidentModal"><div class="dialog"><h2>Create Incident</h2><div class="form"><label class="field"><b>Category</b><select id="fCat"><option>C1</option><option>C2</option><option>C3</option><option>C4</option></select></label><label class="field"><b>Call type</b><input id="fType" value="Medical Emergency"></label><label class="field full"><b>Location</b><input id="fAddr" placeholder="e.g. Blackpool North, FY1"></label><label class="field"><b>Patient</b><input id="fPatient" value="1 adult"></label><label class="field"><b>Caller</b><input id="fCaller" value="Member of Public"></label><label class="field full"><b>Additional information</b><textarea id="fInfo">Training incident</textarea></label></div><div class="dialogfoot"><button class="btn" onclick="closeModal('incidentModal')">Cancel</button><button class="btn primary" onclick="createIncident()">Create & Dispatch</button></div></div></div>
<div class="modal" id="settingsModal"><div class="dialog"><h2>MDT Settings</h2><div class="form"><label class="field"><b>Unit callsign</b><input id="callsign" value="Unit 123"></label><label class="field"><b>Control room</b><input value="Blackpool Control"></label><label class="field full"><b>Map routing</b><select><option>OSRM road routing — training/demo</option><option>Custom self-hosted routing server</option></select></label><label class="field full"><b>Notes</b><textarea>For training / roleplay use. Routing is a normal road route and is not a substitute for an operational navigation system.</textarea></label></div><div class="dialogfoot"><button class="btn primary" onclick="saveSettings()">Save</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const blackpool=[53.8175,-3.0357], blackpoolBounds=[[53.77,-3.12],[53.88,-2.96]];
let incidents=[
{id:'INC-10231',cat:'C1',type:'Cardiac Arrest',addr:'Victoria Road, Blackpool, FY1 6AP',patient:'1 adult',crew:'1',time:'15:18',lat:53.8127,lon:-3.0497,info:'CPR in progress • caller on scene',status:'Assigned'},
{id:'INC-10230',cat:'C1',type:'RTC - Serious',addr:'A583 Lytham Road, Blackpool, FY4 1PX',patient:'2 adults',crew:'2',time:'15:12',lat:53.7934,lon:-3.0378,info:'Road traffic collision',status:'Assigned'},
{id:'INC-10229',cat:'C2',type:'Chest Pain',addr:'Talbot Road, Blackpool, FY1 3AA',patient:'1 adult',crew:'1',time:'15:08',lat:53.8178,lon:-3.0501,info:'Chest pain, conscious and breathing',status:'New'},
{id:'INC-10228',cat:'C3',type:'Fall',addr:'St. Annes Road, Blackpool, FY8 1BU',patient:'1 adult',crew:'1',time:'15:03',lat:53.7797,lon:-3.0027,info:'Fall, no obvious major injury',status:'New'},
{id:'INC-10227',cat:'C3',type:'Breathing Difficulty',addr:'Riversway, Blackpool, FY3 8HH',patient:'1 adult',crew:'1',time:'14:57',lat:53.8303,lon:-3.0181,info:'Breathing difficulty',status:'New'},
{id:'INC-10226',cat:'C4',type:'Mental Health',addr:'North Drive, Blackpool, FY1 4QF',patient:'1 adult',crew:'0',time:'14:48',lat:53.8253,lon:-3.0519,info:'Welfare concern',status:'New'}
];
let selected=incidents[0], unitPos=[53.8038,-3.0502], markers=[], routeLayer=null, unitMarker=null, searchMarker=null, activeTab='details';
const map=L.map('map',{zoomControl:true}).setView(blackpool,13); const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map); const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap contributors © CARTO'}); window.map=map;
function icon(text,cls){return L.divIcon({className:'',html:'<div class="'+cls+'">'+text+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}
function renderMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];incidents.forEach(i=>{let m=L.marker([i.lat,i.lon],{icon:icon(i.cat,'incident-icon c'+i.cat.slice(1))}).addTo(map).bindTooltip(i.cat+' • '+i.type);m.on('click',()=>selectIncident(i.id));markers.push(m)});if(unitMarker)unitMarker.remove();unitMarker=L.marker(unitPos,{icon:icon('123','unit-icon')}).addTo(map).bindTooltip('Unit 123');}
function renderList(filter='all'){const list=document.getElementById('incidentList');const arr=filter==='all'?incidents:incidents.filter(x=>x.cat===filter);document.getElementById('count').textContent=arr.length;document.getElementById('incidentBadge').textContent=incidents.filter(x=>x.status!=='Cleared').length;list.innerHTML=arr.map(i=>`<div class="incident ${selected?.id===i.id?'sel':''}" onclick="selectIncident('${i.id}')"><div class="itop"><span class="cat c${i.cat.slice(1)}">${i.cat}</span><strong>${i.type}</strong><span class="itime">${i.time}</span></div><div class="addr">${i.addr}</div><div class="meta">Patient: ${i.patient} &nbsp;|&nbsp; Crew: ${i.crew} &nbsp;|&nbsp; ${i.status}</div></div>`).join('')}
function selectIncident(id){selected=incidents.find(x=>x.id===id)||selected;activeTab='details';renderList();renderRight();map.flyTo([selected.lat,selected.lon],15,{duration:.6})}
function renderRight(){const i=selected;document.getElementById('priority').innerHTML=`<span class="cat c${i.cat.slice(1)}">${i.cat}</span><div><b>${i.type}</b><div class="mini">${i.addr}</div></div><span style="margin-left:auto">${i.time}</span>`;let body=document.getElementById('rightBody');if(activeTab==='details')body.innerHTML=`<div class="details"><div class="row"><span>Call Type</span><b>${i.type}</b></div><div class="row"><span>Priority</span><b>${i.cat}</b></div><div class="row"><span>Location</span><b>${i.addr}</b></div><div class="row"><span>Incident Ref</span><b>${i.id}</b></div><div class="row"><span>Caller</span><b>Member of Public</b></div><div class="row"><span>Patient</span><b>${i.patient}</b></div><div class="row"><span>Condition</span><b>${i.info}</b></div><div class="row"><span>Status</span><b>${i.status}</b></div></div><div class="task"><b>Tasking</b><button onclick="routeToSelected()">🧭 <span>Navigate to incident</span> ›</button><button onclick="toast('Status updated for '+i.id)">☑ <span>Update status</span> ›</button><button onclick="addNote()">▤ <span>Add notes</span> ›</button><button onclick="activeTab='notes';renderRight()">👤 <span>Patient info</span> ›</button></div>`;else if(activeTab==='history')body.innerHTML='<div class="details"><div class="row"><span>15:18</span><b>Incident received</b></div><div class="row"><span>15:19</span><b>Unit 123 assigned</b></div><div class="row"><span>15:21</span><b>Dispatch acknowledged</b></div><div class="row"><span>15:23</span><b>MDT opened</b></div></div>';else body.innerHTML=`<div class="details"><textarea class="notes" id="noteBox" placeholder="Incident notes...">${localStorage.getItem('note-'+i.id)||''}</textarea><button class="btn primary" style="margin-top:8px" onclick="saveNote()">Save note</button></div>`}
function tab(t,b){activeTab=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRight()}
function filterInc(f,b){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderList(f)}
function setLayer(which){if(which==='dark'){map.removeLayer(osm);dark.addTo(map);document.getElementById('darkBtn').classList.add('active');document.getElementById('normalBtn').classList.remove('active')}else{map.removeLayer(dark);osm.addTo(map);document.getElementById('normalBtn').classList.add('active');document.getElementById('darkBtn').classList.remove('active')}}
async function searchPlace(){let q=document.getElementById('searchInput').value.trim();if(!q)return;try{let url='https://photon.komoot.io/api/?q='+encodeURIComponent(q+', Blackpool, UK')+'&limit=5';let r=await fetch(url);let j=await r.json();if(!j.features?.length){toast('No location found');return}let f=j.features[0], [lon,lat]=f.geometry.coordinates;let p=f.properties;let label=[p.name,p.street,p.housenumber,p.postcode].filter(Boolean).join(' ');if(searchMarker)searchMarker.remove();searchMarker=L.marker([lat,lon]).addTo(map).bindPopup('<b>'+label+'</b><br><button class="btn primary" onclick="routeFromSearch('+lat+','+lon+')">Navigate here</button>').openPopup();map.flyTo([lat,lon],16)}catch(e){toast('Search service unavailable')}}
async function routeFromSearch(lat,lon){await route([unitPos[0],unitPos[1]],[lat,lon],'Search destination')}
async function routeToSelected(){await route(unitPos,[selected.lat,selected.lon],selected.addr)}
async function route(from,to,label){try{toast('Calculating road route…');let c=from[1]+','+from[0]+';'+to[1]+','+to[0];let u='https://router.project-osrm.org/route/v1/driving/'+c+'?overview=full&geometries=geojson&steps=true&alternatives=true';let r=await fetch(u);let j=await r.json();if(j.code!=='Ok')throw Error(j.code);let rt=j.routes[0];if(routeLayer)routeLayer.remove();routeLayer=L.geoJSON(rt.geometry,{style:{color:'#20a8ff',weight:7,opacity:.9}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[70,70]});document.getElementById('routeTime').textContent=Math.max(1,Math.round(rt.duration/60))+' min';document.getElementById('routeDistance').textContent=(rt.distance/1000).toFixed(1)+' km • '+label;document.getElementById('turns').innerHTML=(rt.legs?.[0]?.steps||[]).slice(0,8).map(s=>`<div class="turn">${s.maneuver.type==='arrive'?'🏁':s.maneuver.type==='depart'?'▶':'↪'} ${s.name||'Unnamed road'} <span class="mini">${Math.round(s.distance)}m</span></div>`).join('');document.getElementById('routeBox').classList.add('show');toast('Route ready')}catch(e){toast('Could not calculate route')}}
function clearRoute(){if(routeLayer)routeLayer.remove();routeLayer=null;document.getElementById('routeBox').classList.remove('show')}
function locateUnit(){map.flyTo(unitPos,16);unitMarker?.openTooltip()}
function setStatus(s){if(!selected)return;selected.status=s;renderList();renderRight();toast('Unit 123 → '+s);if(s==='En Route'||s==='Attending')routeToSelected()}
function setUnitStatus(s){document.getElementById('unitStatus').textContent=s;toast('Unit status: '+s)}
function openIncident(){document.getElementById('incidentModal').classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
async function createIncident(){let addr=document.getElementById('fAddr').value.trim()||'Blackpool, Lancashire';try{let r=await fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(addr+', Blackpool, UK')+'&limit=1');let j=await r.json();let f=j.features?.[0];let [lon,lat]=f?f.geometry.coordinates:[-3.0357,53.8175];let id='INC-'+Math.floor(10000+Math.random()*89999), now=new Date();let t=now.toTimeString().slice(0,5);incidents.unshift({id,cat:fv('fCat'),type:fv('fType'),addr:addr,patient:fv('fPatient'),crew:'1',time:t,lat,lon,info:fv('fInfo'),status:'New'});selected=incidents[0];closeModal('incidentModal');renderMarkers();renderList();renderRight();map.flyTo([lat,lon],16);toast(id+' created and dispatched')}catch(e){toast('Incident created, but address could not be mapped')}}
function fv(id){return document.getElementById(id).value}
function addNote(){activeTab='notes';renderRight();document.getElementById('noteBox')?.focus()}
function saveNote(){let v=document.getElementById('noteBox').value;localStorage.setItem('note-'+selected.id,v);toast('Note saved')}
function openMessages(){toast('Control: “Unit 123, status acknowledged.”');document.getElementById('msgBadge').textContent='1'}
function openSettings(){document.getElementById('settingsModal').classList.add('open')}
function saveSettings(){localStorage.setItem('callsign',fv('callsign'));closeModal('settingsModal');toast('Settings saved')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2800)}
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('en-GB')};setInterval(tick,1000);tick();
renderMarkers();renderList();renderRight();
</script>
</body></html>
